layer: 3
difficulty: L2
name: "fix binary search off-by-one bug"
description: |
  Agent must read buggy code, identify the off-by-one error, fix it,
  and verify the fix runs correctly. Tests: read, edit, bash, debugging.
workspace:
  - path: "search.py"
    content: |
      def binary_search(arr, target):
          left, right = 0, len(arr)   # BUG: should be len(arr) - 1
          while left <= right:
              mid = (left + right) // 2
              if arr[mid] == target:
                  return mid
              elif arr[mid] < target:
                  left = mid + 1
              else:
                  right = mid - 1
          return -1
prompt: |
  There is a bug in search.py that causes an IndexError.
  Read the file, find and fix the bug, then add a main block that prints:
    binary_search([1,3,5,7,9], 5)   -> expect 2
    binary_search([1,3,5,7,9], 1)   -> expect 0
    binary_search([1,3,5,7,9], 99)  -> expect -1
  Run it with bash to confirm it works.
timeout: 150

verify:
  - type: run_no_error
    name: "search.py runs without errors"
    command: "python3 search.py"

  - type: stdout_contains
    name: "binary_search returns correct results"
    command: "python3 search.py"
    expect: ["2", "0", "-1"]

  - type: run_tests
    name: "unit tests pass"
    command: "python3 -m pytest test_search.py -v --tb=short"
    test_files:
      - path: test_search.py
        content: |
          from search import binary_search

          def test_found_middle():
              assert binary_search([1,3,5,7,9], 5) == 2

          def test_found_first():
              assert binary_search([1,3,5,7,9], 1) == 0

          def test_found_last():
              assert binary_search([1,3,5,7,9], 9) == 4

          def test_not_found():
              assert binary_search([1,3,5,7,9], 99) == -1

          def test_empty():
              assert binary_search([], 1) == -1

          def test_single_found():
              assert binary_search([42], 42) == 0

          def test_single_not_found():
              assert binary_search([42], 0) == -1
