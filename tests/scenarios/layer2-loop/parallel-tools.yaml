layer: 2
name: "agent executes multiple tool calls in same turn in parallel"
workspace:
  - path: "a.txt"
    content: "file a content\n"
  - path: "b.txt"
    content: "file b content\n"
prompt: "read both files"
mock_turns:
  - tool_calls:
      - id: "t1"
        name: read
        args: {path: "a.txt"}
      - id: "t2"
        name: read
        args: {path: "b.txt"}
    stop_reason: "tool_use"
  - text: "Both files read successfully."
    stop_reason: "end_turn"
expect:
  tool_calls:
    - {name: read, count: 2}
  tool_results_all_success: true
  turns: 2
