layer: 2
name: "agent completes read → edit → bash sequence correctly"
description: |
  Classic coding agent workflow: read a file, edit it, run it.
  Tests that tool results are correctly fed back into subsequent turns.
workspace:
  - path: "calc.py"
    content: |
      def add(a, b):
          return a - b  # BUG

      print(add(2, 3))
prompt: "Fix the bug in calc.py and run it."
mock_turns:
  - tool_calls:
      - id: "t1"
        name: read
        args: {path: "calc.py"}
    stop_reason: "tool_use"
  - tool_calls:
      - id: "t2"
        name: edit
        args:
          path: "calc.py"
          edits:
            - oldText: "return a - b  # BUG"
              newText: "return a + b"
    stop_reason: "tool_use"
  - tool_calls:
      - id: "t3"
        name: bash
        args: {command: "python3 calc.py"}
    stop_reason: "tool_use"
  - text: "Fixed! Output is 5."
    stop_reason: "end_turn"
expect:
  tool_calls:
    - {name: read,  count: 1}
    - {name: edit,  count: 1}
    - {name: bash,  count: 1}
  tool_results_all_success: true
  turns: 4
  workspace:
    - path: "calc.py"
      content: "def add(a, b):\n    return a + b\n\nprint(add(2, 3))\n"
